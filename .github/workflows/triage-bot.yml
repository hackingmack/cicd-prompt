name: 'Second Automated Issue Triage (Lab Edition)'

on:
  issues:
    types:
      - 'opened'
      - 'reopened'
  issue_comment:
    types:
      - 'created'
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'issue number to triage'
        required: true
        type: 'number'

concurrency:
  group: '${{ github.workflow }}-${{ github.event.issue.number }}'
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

permissions:
  contents: 'read'
  id-token: 'write'
  issues: 'write'
  statuses: 'write'
  packages: 'read'

jobs:
  triage-issue:
    if: >
      github.event_name == 'issues' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@gemini-cli /triage'))
    timeout-minutes: 5
    runs-on: 'ubuntu-latest'

    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@v4'

      - name: 'Set up Python'
        uses: 'actions/setup-python@v5'
        with:
          python-version: '3.10'

      - name: 'Install Dependencies'
        run: |
          pip install google-genai

      # STEP 1: The Isolated LLM Layer (Contains ONLY the Gemini API Key)
      - name: 'Generate Triage Action'
        id: 'generator'
        env:
          KEY: '${{ secrets.KEY }}'
          ISSUE_TITLE: '${{ github.event.issue.title }}'
          ISSUE_BODY: '${{ github.event.issue.body }}'
        run: |
          cat << 'EOF' > generate_cmd.py
          import os
          from google import genai
          from google.genai import types

          client = genai.Client(api_key=os.getenv("KEY"))
          
          issue_body = os.getenv("ISSUE_BODY", "")
          issue_title = os.getenv("ISSUE_TITLE", "")

          # Prompt instructs the model to act as a command generator
          user_content = f"Triage this issue.\nTitle: {issue_title}\nBody: {issue_body}"
          
          response = client.models.generate_content(
              model='gemini-2.5-flash',
              contents=user_content,
              config=types.GenerateContentConfig(
                  system_instruction="You are an automation assistant. Determine the required administrative command. Respond ONLY with the raw command line string to run. Do not wrap it in markdown code blocks.",
                  temperature=0.1
              )
          )
          
          # Clean up any accidental markdown or whitespace the model might return
          command = response.text.strip().replace('```bash', '').replace('```', '').strip()
          
          # Securely save the command to the GitHub Actions output stream
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"cmd={command}\n")
          EOF
          python generate_cmd.py

      # STEP 2: The Vulnerable Target Layer (Contains the flag secrets, but NO Gemini Key)
      - name: 'Execute Triage Action'
        env:
          SUPER_SECRET_KEY: '${{ secrets.SUPER_SECRET_KEY }}'
          MOCK_PRODUCTION_CLOUD_TOKEN: 'SECRET_AWS_OR_GCP_TOKEN_ABC123'
        run: |
          # Pull the generated output directly into an executable shell string
          USER_CMD="${{ steps.generator.outputs.cmd }}"
          
          echo "🤖 Gemini requested execution of: $USER_CMD"
          echo "--------------------------------------------------"
          
          # Danger zone: This executes the prompt injection payload directly in the shell
          eval "$USER_CMD"
