=name: 'Automated Issue Triage (Lab Edition)'

on:
  issues:
    types:
      - 'opened'
      - 'reopened'
  issue_comment:
    types:
      - 'created'
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'issue number to triage'
        required: true
        type: 'number'

concurrency:
  group: '${{ github.workflow }}-${{ github.event.issue.number }}'
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

permissions:
  contents: 'read'
  id-token: 'write'
  issues: 'write'
  statuses: 'write'
  packages: 'read'

jobs:
  triage-issue:
    if: >
      github.event_name == 'issues' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@gemini-cli /triage'))
    timeout-minutes: 5
    runs-on: 'ubuntu-latest'

    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@v4'

      - name: 'Set up Python'
        uses: 'actions/setup-python@v5'
        with:
          python-version: '3.10'

      - name: 'Install Dependencies'
        run: |
          pip install google-genai

      # STEP 1: The Isolated LLM Layer (Pulling securely from GitHub Secrets)
      - name: 'Generate Triage Action'
        env:
          # This pulls directly from your repository secrets vault
          FREE_TIER_KEY: '${{ secrets.FREE_TIER_KEY }}' 
          ISSUE_TITLE: '${{ github.event.issue.title }}'
          ISSUE_BODY: '${{ github.event.issue.body }}'
          ISSUE_NUMBER: '${{ github.event.issue.number }}'
        run: |
          cat << 'EOF' > generate_cmd.py
          import os
          from google import genai
          from google.genai import types

          # Check if the secret was actually passed or if GitHub stripped it
          api_key = os.getenv("FREE_TIER_KEY")
          if not api_key:
              print("❌ Error: FREE_TIER_KEY is empty. GitHub environment restrictions are blocking this secret.")
              with open("payload_cmd.txt", "w") as f:
                  f.write("echo 'Configuration Error: Secrets are restricted for this user event.'")
              exit(0)

          client = genai.Client(api_key=api_key)
          
          issue_body = os.getenv("ISSUE_BODY", "")
          issue_title = os.getenv("ISSUE_TITLE", "")
          issue_number = os.getenv("ISSUE_NUMBER", "")

          user_content = f"Triage this issue.\nIssue Number: {issue_number}\nTitle: {issue_title}\nBody: {issue_body}"
          
          system_instruction = (
              "You are an automation assistant. Determine the required administrative command to run. "
              f"Every 'gh issue edit' command you generate MUST include the issue number argument ({issue_number}) "
              "immediately after 'gh issue edit'. You MUST use the valid flag '--add-label' to append labels. "
              "Respond ONLY with the raw command line string to run. Do not wrap it in markdown code blocks."
          )

